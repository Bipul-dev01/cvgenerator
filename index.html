<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <title>Resume Generator</title>
  </head>
  <body>
    <div class="container py-5" id="cv-form">
      <h1 class="text-center">🎓 Resume Generator</h1>
      <p class="text-center text-secondary">
        Developer: <strong>Tajul Islam Bipul</strong>
      </p>

      <div class="row mt-4">
        <!-- Left Column -->

        <div class="col-md-6">
          <h3>Personal Information</h3>
          <div class="form-group mt-3">
            <label for="nameFiled" class="mb-1">Your Name</label>
            <input
              type="text"
              id="nameFiled"
              placeholder="Enter here"
              class="form-control"
            />
          </div>
          <div class="form-group mt-3">
            <label for="contactFiled" class="mb-1">Your Contact</label>
            <input
              type="text"
              id="contactFiled"
              placeholder="Enter here"
              class="form-control"
            />
          </div>
          <div class="form-group mt-3">
            <label for="addressFiled" class="mb-1">Your Address</label>
            <textarea
              id="addressFiled"
              placeholder="Enter here"
              class="form-control"
              rows="4"
            ></textarea>
          </div>

          <!-- Code for setting image -->

          <div class="form-group mt-3">
            <label for="" class="mb-1">Select your profile picture</label>
            <input id="imageField" type="file" />
          </div>

          <!-- Social Links -->

          <p class="text-secondary mt-4">🌐 Social Links</p>
          <div class="form-group mt-2">
            <label for="fbFiled" class="mb-1">Facebook</label>
            <input
              type="text"
              id="fbFiled"
              placeholder="Enter here"
              class="form-control"
            />
          </div>
          <div class="form-group mt-2">
            <label for="instaFiled" class="mb-1">Instagram</label>
            <input
              type="text"
              id="instaFiled"
              placeholder="Enter here"
              class="form-control"
            />
          </div>
          <div class="form-group mt-2">
            <label for="linkedFiled" class="mb-1">LinkedIn</label>
            <input
              type="text"
              id="linkedFiled"
              placeholder="Enter here"
              class="form-control"
            />
          </div>

          <!-- Gender -->
          <p class="text-secondary mt-4">⚧ Gender</p>
          <div class="form-group mt-2 d-flex align-items-center gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="gender"
                id="male"
                value="Male"
              />
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="gender"
                id="female"
                value="Female"
              />
              <label class="form-check-label" for="female">Female</label>
            </div>
          </div>

          <!-- Date of Birth -->

          <p class="text-secondary mt-4">🎂 Date of Birth</p>
          <div class="form-group mt-2 d-flex gap-2">
            <select id="dobDay" class="form-control">
              <option value="">Day</option>
            </select>
            <select id="dobMonth" class="form-control">
              <option value="">Month</option>
            </select>
            <select id="dobYear" class="form-control">
              <option value="">Year</option>
            </select>
          </div>
        </div>

        <!-- Right Column -->

        <div class="col-md-6">
          <h3 class="proInfo">Professional Information</h3>
          <div class="form-group mt-3">
            <label for="objectiveField" class="mb-1">Objectives</label>
            <textarea
              placeholder="Enter here"
              class="form-control"
              rows="4"
              id="objectiveField"
            ></textarea>
          </div>

          <!-- Work Experience -->

          <div class="form-group mt-3" id="we">
            <label class="mb-1">Work Experience</label>
            <textarea
              placeholder="Enter here"
              class="form-control weField"
              rows="3"
            ></textarea>
            <div class="text-center mt-2" id="weAddBtn">
              <button onclick="addNewWEfiled()" class="btn btn-primary btn-sm">
                ➕ Add
              </button>
            </div>
          </div>

          <!-- Academic Qualification -->

          <div class="form-group mt-3" id="aqField">
            <label class="mb-1">Academic Qualification</label>
            <textarea
              placeholder="Enter here"
              class="form-control academicQualification"
              rows="3"
            ></textarea>
            <div class="text-center mt-2" id="aqAddBtn">
              <button onclick="addNewAQfiled()" class="btn btn-primary btn-sm">
                ➕ Add
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="text-center mt-4">
        <button onclick="generateCV()" class="btn btn-primary btn-lg">
          🚀 Generate CV
        </button>
      </div>
    </div>

    <!-- CV Template -->

    <div class="container" id="cv-template">
      <div class="row">
        <!-- Left -->

        <div class="col-md-4 text-center py-5 background">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvG_T2e_jE-VxZCIkDp0h6wPskEtxsXcwbcA&s"
            alt="Profile"
            class="img-fluid myimg mb-3"
            id="imgTemplate"
          />
          <h4 id="nameT1"></h4>
          <p id="contactT"></p>
          <p id="addressT"></p>
          <hr />
          <p id="fbT"></p>
          <p id="instaT"></p>
          <p id="linkedT"></p>

          <!-- Gender -->
          <p><strong>Gender:</strong> <span id="genderT"></span></p>

          <p><strong>Date of Birth:</strong> <span id="dobT"></span></p>
        </div>

        <!-- Right -->

        <div class="col-md-8 py-5">
          <h1
            id="nameT2"
            class="text-center mb-4"
            style="font-weight: 900"
          ></h1>

          <!-- Objective -->

          <div class="card mt-3">
            <div class="background py-1 px-2"><h3>Objective</h3></div>
            <div class="card-body"><p id="objectiveT"></p></div>
          </div>

          <!-- Work Experience -->

          <div class="card mt-3">
            <div class="background py-1 px-2"><h3>Work Experience</h3></div>
            <div class="card-body"><ul id="weT"></ul></div>
          </div>

          <!-- Academic Qualification -->

          <div class="card mt-3">
            <div class="background py-1 px-2">
              <h3>Academic Qualification</h3>
            </div>
            <div class="card-body"><ul id="aqT"></ul></div>
          </div>

          <!-- <div class="text-center mt-4">
            <button onclick="printCV()" class="btn btn-primary">
              🖨 Print CV
            </button>
          </div> -->

          <div class="text-center mt-4 no-pdf">
            <button onclick="printCV()" class="btn btn-primary">
              🖨 Print CV
            </button>
            <button onclick="downloadPDF()" class="btn btn-success ms-2">
              ⬇ Download as PDF
            </button>
          </div>
          
        </div>
      </div>
    </div>

    <!-- **************************************************** -->

    <p id="numbers" class="numbers">Two</p>
    <p id="numbers" class="numbers">Three</p>

    <h1 id="outPut"></h1> -->

    <script src="script.js"></script>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
